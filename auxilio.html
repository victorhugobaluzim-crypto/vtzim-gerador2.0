<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auxílio VTZIM — Acesso</title><style>
:root{color-scheme:dark;--pink:#ff25ce;--bg:#09070d;--panel:#15101a;--line:#512044}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35102e,#09070d 60%);color:#fff;font-family:system-ui,sans-serif;min-height:100vh}.wrap{width:min(620px,94%);margin:auto;padding:35px 0}.brand{text-align:center;font-weight:950;font-size:clamp(30px,8vw,48px);font-style:italic}.brand span{display:block;color:var(--pink);letter-spacing:4px}.sub{text-align:center;color:#b6a9bb;font-size:12px;letter-spacing:2px}.card{margin-top:28px;border:1px solid var(--line);border-radius:18px;background:#120d17;padding:22px;box-shadow:0 12px 45px #0006}.card h2{margin:0 0 6px}.muted{color:#b6a9bb;font-size:13px;line-height:1.5}label{display:block;margin:18px 0 7px;font-size:13px}input,button{font:inherit;width:100%;border-radius:10px;padding:14px}input{border:1px solid #623052;background:#09070d;color:#fff}button{margin-top:14px;border:0;background:linear-gradient(90deg,#c800a7,#ff2acb);color:white;font-weight:900;cursor:pointer}.msg{margin-top:14px;font-size:13px}.ok{color:#7affb4}.bad{color:#ff9eb7}.tiny{text-align:center;color:#93859b;font-size:11px;margin-top:22px}a{color:#ff91e8}
</style></head><body><main class="wrap"><div class="brand">AUXÍLIO <span>VTZIM</span></div><p class="sub">PAINEL DE ACESSO POR CHAVE</p><section class="card"><h2>🔑 Ativar acesso</h2><p class="muted">Digite uma chave criada no gerador externo. A validade é conferida pelo servidor.</p><label for="key">Sua chave</label><input id="key" placeholder="VTZIM-XXXX-XXXX-XXXX" autocomplete="off"><button id="check">VALIDAR CHAVE</button><div id="msg" class="msg" role="status"></div><div id="access" hidden><p class="ok">✓ Acesso demonstrativo autorizado.</p><p class="muted" id="expiry"></p></div></section><p class="tiny">Protótipo de validação. Não modifica nem injeta recursos no Free Fire.</p><script>
const $=id=>document.getElementById(id);$('check').onclick=async()=>{const key=$('key').value.trim();$('msg').textContent='Verificando…';$('msg').className='msg';$('access').hidden=true;try{const r=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const d=await r.json();$('msg').textContent=d.message||d.error||'Erro';$('msg').className='msg '+(d.valid?'ok':'bad');if(d.valid){$('access').hidden=false;$('expiry').textContent=d.permanent?'Esta chave é permanente.':'Validade até: '+new Date(d.expiresAt).toLocaleString('pt-BR');}}catch{$('msg').textContent='Não foi possível conectar ao servidor.';$('msg').className='msg bad'}};$('key').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
</script></main></body></html>
