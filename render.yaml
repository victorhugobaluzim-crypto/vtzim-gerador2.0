services:
  - type: web
    name: auxilio-vtzim-keys
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: vtzim-keys-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: KEY_STORE
        value: /var/data/keys.json
      - key: ADMIN_PASSWORD
        generateValue: true
