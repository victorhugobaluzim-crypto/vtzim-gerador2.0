<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VTZIM — Gerador privado</title><style>
:root{color-scheme:dark;--pink:#ff25ce;--line:#512044}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35102e,#09070d 60%);color:#fff;font-family:system-ui,sans-serif;min-height:100vh}.wrap{width:min(720px,94%);margin:auto;padding:30px 0}.brand{text-align:center;font-weight:950;font-size:clamp(27px,7vw,43px);font-style:italic}.brand span{color:var(--pink)}.card{margin-top:20px;border:1px solid var(--line);border-radius:16px;background:#120d17;padding:20px}h2{margin-top:0}.muted{color:#b6a9bb;font-size:13px;line-height:1.5}label{display:block;margin:14px 0 6px;font-size:13px}input,select,button{font:inherit;width:100%;border-radius:9px;padding:12px}input,select{border:1px solid #623052;background:#09070d;color:#fff}button{margin-top:12px;border:0;background:linear-gradient(90deg,#c800a7,#ff2acb);color:#fff;font-weight:850;cursor:pointer}.secondary{background:#2a1428;border:1px solid #653056}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{font-size:13px;margin-top:12px}.ok{color:#7affb4}.bad{color:#ff9eb7}.key{font:700 15px ui-monospace,monospace;overflow-wrap:anywhere;color:#ff8de6}.entry{padding:13px 0;border-bottom:1px solid #352236}.entry:last-child{border-bottom:0}.tiny{font-size:11px;color:#9b8da2}@media(max-width:450px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">GERADOR <span>VTZIM</span></div><p class="muted" style="text-align:center">Painel privado separado do Auxílio • chaves compartilhadas pelo servidor</p><section class="card" id="login"><h2>🔐 Acesso de administrador</h2><p class="muted">Use a senha configurada no servidor quando ele foi iniciado.</p><label for="password">Senha do administrador</label><input id="password" type="password" autocomplete="current-password"><button id="enter">ENTRAR</button><div id="loginmsg" class="msg"></div></section><section class="card" id="panel" hidden><h2>⚡ Criar chave de acesso</h2><label for="prefix">Prefixo</label><input id="prefix" value="VTZIM" maxlength="12"><label for="duration">Validade</label><select id="duration"><option value="1h">1 hora</option><option value="1d">1 dia</option><option value="3d">3 dias</option><option value="7d">7 dias</option><option value="30d">30 dias</option><option value="perm">Permanente</option></select><button id="generate">GERAR CHAVE</button><div id="result" class="msg"></div><button class="secondary" id="copy" hidden>COPIAR CHAVE</button><button class="secondary" id="refresh">ATUALIZAR LISTA</button><div id="list"></div><p class="tiny">Proteja a senha de administrador. Este painel deve ser hospedado com HTTPS para uso público.</p></section><script>
const $=id=>document.getElementById(id);let adminPassword='';async function api(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':adminPassword},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro no servidor');return d}
$('enter').onclick=async()=>{adminPassword=$('password').value;try{await api('/api/list');$('login').hidden=true;$('panel').hidden=false;$('loginmsg').textContent='';refresh()}catch(e){$('loginmsg').textContent=e.message;$('loginmsg').className='msg bad';adminPassword=''}};
$('generate').onclick=async()=>{try{const d=await api('/api/generate',{prefix:$('prefix').value,duration:$('duration').value});$('result').innerHTML='Chave gerada: <div class="key" id="newkey"></div><div class="muted" id="expire"></div>';$('newkey').textContent=d.key;$('expire').textContent=d.permanent?'Validade: permanente':'Expira em: '+new Date(d.expiresAt).toLocaleString('pt-BR');$('copy').hidden=false;$('copy').onclick=async()=>{await navigator.clipboard.writeText(d.key);$('copy').textContent='COPIADA ✓'};refresh()}catch(e){$('result').textContent=e.message;$('result').className='msg bad'}};
async function refresh(){try{const d=await api('/api/list');$('list').innerHTML='<h3>Chaves emitidas</h3>'+ (d.keys.length?d.keys.map(x=>`<div class="entry"><div class="key"></div><div class="muted"></div><button class="secondary">Revogar chave</button></div>`).join(''):'<p class="muted">Nenhuma chave criada ainda.</p>');const entries=$('list').querySelectorAll('.entry');d.keys.forEach((x,i)=>{const el=entries[i];el.children[0].textContent=x.key;el.children[1].textContent='Status: '+x.status+' • '+(!x.expiresAt?'Permanente':'Expira: '+new Date(x.expiresAt).toLocaleString('pt-BR'));const b=el.children[2];b.disabled=x.revoked;b.textContent=x.revoked?'REVOGADA':'REVOGAR';b.onclick=async()=>{if(confirm('Revogar esta chave?')){await api('/api/revoke',{key:x.key});refresh()}}})}catch(e){$('list').textContent=e.message}}
$('refresh').onclick=refresh;
</script></main></body></html>
